<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" width="420" height="560" role="img" aria-label="Portrait placeholder">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="55%">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6f5ee"/>
      <stop offset="1" stop-color="#a7d8c0"/>
    </linearGradient>
  </defs>
  <!-- transparent background; soft glow blends into dark hero -->
  <circle cx="210" cy="200" r="200" fill="url(#glow)"/>
  <!-- shoulders -->
  <path d="M70 560 C70 430 135 365 210 365 C285 365 350 430 350 560 Z" fill="url(#fig)" opacity="0.92"/>
  <!-- head -->
  <circle cx="210" cy="222" r="82" fill="url(#fig)" opacity="0.95"/>
  <!-- soft highlight -->
  <circle cx="184" cy="198" r="24" fill="#ffffff" opacity="0.25"/>
</svg>
