a Ma'am is truly the best wellness coach in Raipur! I reduced 12kg in 3 months without starving or feeling weak. Her pharmacy background gave me immense confidence.",name:"Priya Sharma",city:"Raipur"},{quote:"I was struggling with severe PCOD and fatigue. Her food-first approach restored my regular cycles within 60 days. Highly recommend her to all women in Chhattisgarh!",name:"Anjali Verma",city:"Bhilai"},{quote:"As a busy businessman, I had high triglycerides and heavy abdominal fat. Shweta adjusted my meals around my travel schedule. Lost 9kg and felt energetic again.",name:"Rajesh Agarwal",city:"Raipur"},{quote:"Her empathy and weekly follow-ups kept me motivated. She explains the scientific reason behind every food choice. Truly deserving of the FSIA Super Woman Award!",name:"Kavita Sahu",city:"Durg"}],Kd=[{Icon:Bh,title:"Weight Management",tone:"bg-emerald-100 text-emerald-800",desc:"A non-starvation fat-loss blueprint — metabolic reset, cellular nutrition and stable blood sugar, built on Shweta’s own 18kg transformation.",body:["Most diets fail because they starve the body and ignore the root cause. Shweta’s Weight Management programme takes the opposite path — it resets your metabolism using food-first, locally-available meals tuned to your body, not a generic chart.","As a registered pharmacist, Shweta screens for the hidden drivers of stubborn weight — insulin resistance, thyroid imbalance and medication effects — so every change is clinically safe. Combined with circadian habit correction, the result is steady fat loss that actually lasts."],bullets:["Personalised, food-first meal plans","Metabolism & blood-sugar focus","No crash diets or chemical fat-burners","Weekly follow-ups & accountability"]},{Icon:Iu,title:"PCOD & Hormone Care",tone:"bg-rose-100 text-rose-700",desc:"Root-cause protocols to restore regular cycles and balance hormones and insulin — gentle, food-first and sustainable.",body:["PCOD and hormonal imbalance rarely need extreme measures — they need consistency and the right nutrition. This programme works on the underlying insulin resistance and inflammation that disrupt your cycle.","Through targeted, seasonal Indian meals, gentle movement and stress regulation, many clients see their cycles regularise within weeks — without harsh restrictions, and safely alongside any medication they already take."],bullets:["Cycle & hormone rebalancing","Insulin-resistance support","PCOS/PCOD-friendly nutrition","Pharmacist-verified safety"]},{Icon:fy,title:"Thyroid & Metabolism",tone:"bg-amber-100 text-amber-700",desc:"Pharmacist-guided support for sluggish thyroid and slow metabolism — safely alongside your existing medicines.",body:["A sluggish thyroid drains energy, slows metabolism and makes weight loss feel impossible. This programme supports thyroid function through nutrition, nutrient timing and lifestyle — never in conflict with your prescription.","Shweta’s pharmacology background means your thyroid medication, supplements and diet are coordinated as one plan, so you regain energy and momentum without guesswork."],bullets:["Thyroid-supportive lifestyle","Energy & metabolism boost","Safe with your prescriptions","Symptom tracking"]},{Icon:Mn,title:"Diabetes Reversal",tone:"bg-emerald-100 text-emerald-800",desc:"Lifestyle plans to reverse Type-2 pre-diabetes and stabilise blood sugar with clinically safe changes.",body:["Type-2 pre-diabetes is often reversible with the right food and habits. This programme stabilises blood sugar through balanced meals, smart carb timing and sustainable movement.","Every change is monitored and clinically safe — designed to reduce spikes, improve markers and, wherever possible, lower dependence on medication under your doctor’s guidance."],bullets:["Blood-sugar stabilisation","Type-2 pre-diabetes focus","Clinically safe protocols","Ongoing monitoring"]},{Icon:Fd,title:"Lifestyle & Bio-Rhythm",tone:"bg-violet-100 text-violet-700",desc:"Sleep, stress and circadian alignment for lasting energy, calm and hormonal balance.",body:["Health isn’t only what you eat — it’s when you sleep, how you handle stress and how aligned your day is with your body clock. This programme restores your natural circadian rhythm.","By fixing sleep, managing stress and syncing meals and activity to your bio-rhythm, clients report deeper energy, steadier mood and better hormonal balance — the foundation every other result is built on."],bullets:["Sleep & circadian reset","Stress-management routines","Daily bio-rhythm mapping","Sustainable habit building"]},{Icon:Wd,title:"Preventive Health",tone:"bg-sky-100 text-sky-700",desc:"Simple daily habits to prevent illness and stay vibrant and medicine-free for the long run.",body:["The best treatment is prevention. This programme builds simple, repeatable daily habits that keep you and your family vibrant and reduce the risk of lifestyle disease.","From immunity and nutrition to screenings and everyday routines, Shweta helps you stay ahead of problems — so wellness becomes a way of life, not a reaction to illness."],bullets:["Immunity & vitality focus","Preventive screenings guidance","Family wellness habits","Long-term medicine-free living"]}],Ey=[{name:"Shweta Mishra",award:"Super Woman 2026 · Wellness",city:"Raipur, CG",img:"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQsAAAEmCAYAAAB1Z7W6AAAAAXNSR0IArs4c6QAAAERlWElmTU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAABC6ADAAQAAAABAAABJgAAAACc4dT3AABAAElEQVR4Aey9WdBl13Xfd86d7zePPaAbI0FQYEuUSIikREoKZEuihgxyTDKSHSWspIpJlZIq27FdGZxUp/yWPOXVDyk7yUNKSlJx2ZVyBlXBlUiyFJGG6ICiCJKYutFo9PiNd743v9/a53x9vx5IACSABvvs7vOdaU9n373+e6211147z6pwP7dA/oUsq2XnztX3b948Uet0Ts5qtcZw1sjnK930ZuyfUZZn+SyfTsejQfba8PK3r/t0O8tmv5tlE6+rULXAO22BY53unWZSpfvBtsB5AOKPnnxyEwD40Cif/UxWa5wc5/lHZrXG09NGsz3N88CGWS2Vm89Ag+kMmAAPOGeT2SCfzv6kNR2/Upvms9Zs+GprOvuDfDa40anVrpy7cGFAGdMfbK2r3H7YW6ACi/voF4aLqPefemp9OMl/ctxs/vqslv/cNMsfnua17iTP82leh/brsAh5NpxNszEMxmQyymazWTYFJGo8AyRADoEjn9YBihovm7PpXmM
